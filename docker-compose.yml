services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms
      POSTGRES_DB: dms
    ports:
      - "5432:5432"
    volumes:
      - dms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dms-minio
      MINIO_ROOT_PASSWORD: dms-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dms_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dms-minio dms-minio-secret &&
      mc mb --ignore-existing local/dms-documents &&
      mc version enable local/dms-documents &&
      mc anonymous set none local/dms-documents &&
      mc cors set local/dms-documents /cors.xml || true
      "
    volumes:
      - ./infra/minio-cors.xml:/cors.xml:ro

volumes:
  dms_postgres_data:
  dms_minio_data:
